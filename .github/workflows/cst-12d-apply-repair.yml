name: CST 12D Apply Guarded Repair

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/repair_cst12_v42.py"
      - ".github/workflows/cst-12d-apply-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: cst-12d-corrected-inspection-001
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply fail-closed repair
        run: python scripts/repair_cst12_v42.py

      - name: Syntax check repaired files
        run: |
          python -m py_compile \
            cosmos/web/__init__.py \
            cosmos/web/cosmosynapse/model/cosmos_config.py \
            cosmos/web/cosmosynapse/model/cosmos_model.py \
            scripts/train_12d_brain.py
          git diff --check

      - name: Install inspection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Require corrected inspection GREEN before commit
        run: pytest -q tests/test_cst12_corrected_inspection.py

      - name: Commit only verified repair targets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cosmos/web/__init__.py \
            cosmos/web/cosmosynapse/model/cosmos_config.py \
            cosmos/web/cosmosynapse/model/cosmos_model.py \
            scripts/train_12d_brain.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 1
          fi
          git commit -m "fix: repair executable CST 12D state path"
          git push origin HEAD:cst-12d-corrected-inspection-001
